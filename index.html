
    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnitrix Interface</title>
    <style>
        body {
            background-color: #0b1d0b;
            color: #00ff00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Container do Omnitrix */
        .omnitrix-container {
            position: relative;
            width: 300px;
            height: 300px;
            border: 15px solid #333;
            border-radius: 50%;
            background: radial-gradient(circle, #111 40%, #222 70%);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4), inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }

        /* O miolo verde/preto do Omnitrix */
        .display {
            width: 200px;
            height: 200px;
            background-color: #000;
            border-radius: 50%;
            border: 8px solid #00ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px #00ff00;
        }

        /* Silhueta ou Ícone do Alien */
        .alien-display {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ff00;
            text-align: center;
            z-index: 2;
            animation: pulse 1.5s infinite;
        }

        /* Linhas clássicas do Omnitrix (Formato de Ampulheta) */
        .hourglass-top, .hourglass-bottom {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            z-index: 1;
            opacity: 0.3;
        }
        .hourglass-top {
            border-top: 90px solid #00ff00;
            top: 0;
        }
        .hourglass-bottom {
            border-bottom: 90px solid #00ff00;
            bottom: 0;
        }

        /* Estado ativo quando seleciona */
        .omnitrix-container.active {
            animation: flash 0.2s ease 3;
        }

        /* Instruções */
        .instructions {
            margin-top: 30px;
            font-size: 14px;
            color: #88ff88;
            text-align: center;
            line-height: 1.5;
        }

        .highlight {
            background-color: #00ff00;
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Animações */
        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.7; transform: scale(0.95); }
        }

        @keyframes flash {
            0% { border-color: #00ff00; box-shadow: 0 0 50px #00ff00; }
            100% { border-color: #333; box-shadow: 0 0 10px #00ff00; }
        }
    </style>
</head>
<body>

    <div class="omnitrix-container" id="omnitrix">
        <div class="display">
            <div class="hourglass-top"></div>
            <div class="alien-display" id="alienName">Carregando...</div>
            <div class="hourglass-bottom"></div>
        </div>
    </div>

    <div class="instructions">
        Os aliens estão passando na tela.<br>
        Pressione a tecla <span class="highlight">ALT</span> para selecionar um aleatoriamente!
    </div>

    <script>
        // Lista com os 10 aliens clássicos
        const aliens = [
            "Chama", "Quatro Braços", "XLR8", "Ultra T", 
            "Massa Cinzenta", "Diamante", "Aquático", 
            "Insectóide", "Fantasmático", "Besta"
        ];

        let currentIndex = 0;
        let isSpinning = true;
        const alienDisplay = document.getElementById('alienName');
        const omnitrix = document.getElementById('omnitrix');

        // Função que fica rodando os aliens continuamente
        function cycleAliens() {
            if (isSpinning) {
                currentIndex = (currentIndex + 1) % aliens.length;
                alienDisplay.textContent = aliens[currentIndex];
            }
        }

        // Intervalo de troca rápida (simulando o painel girando)
        let intervalId = setInterval(cycleAliens, 150);

        // Escuta o evento do teclado
        window.addEventListener('keydown', function(event) {
            // Verifica se a tecla pressionada foi o "Alt"
            if (event.key === 'Alt') {
                event.preventDefault(); // Previne comportamentos padrões do Alt no VS Code
                
                // Para o ciclo e escolhe um índice completamente aleatório
                isSpinning = false;
                clearInterval(intervalId);

                const randomIndex = Math.floor(Math.random() * aliens.length);
                alienDisplay.textContent = aliens[randomIndex];
                
                // Efeito visual de seleção ativa
                omnitrix.classList.add('active');
                alienDisplay.style.color = "#ffffff";
                alienDisplay.style.fontSize = "28px";

                // Destrava o Omnitrix após 3 segundos para voltar a girar
                setTimeout(() => {
                    omnitrix.classList.remove('active');
                    alienDisplay.style.color = "#00ff00";
                    alienDisplay.style.fontSize = "24px";
                    isSpinning = true;
                    intervalId = setInterval(cycleAliens, 150);
                }, 3000);
            }
        });
    </script>
</body>
</html>
